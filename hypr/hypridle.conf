# Hyprland 0.56+: dispatchers are Lua calls — `hyprctl dispatch dpms on` is rejected, use hl.dsp.dpms(...).
# dpms takes a TABLE: hl.dsp.dpms({action = "on"|"off"|"toggle"}). A bare string, hl.dsp.dpms("on"), is treated
# as TOGGLE and blanks the screen (bit us 2026-09-14). Same form as /usr/share/hypr/hypridle.conf.
# DPMS off used to kill the GPU on nouveau (GSP resume -110, black screen until reboot, 2026-09-13/14); since
# nouveau.runpm=0 (2026-09-14) a DPMS off/on cycle survives, but idle "screen off" stays backlight 0 for now.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
listener { timeout = 300;  on-timeout = brightnessctl -s set 20%; on-resume = brightnessctl -r }
listener { timeout = 600;  on-timeout = loginctl lock-session }
listener { timeout = 900;  on-timeout = brightnessctl -q -s set 0; on-resume = brightnessctl -q -r }
