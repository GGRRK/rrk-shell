# Hyprland 0.56+: dispatchers are Lua calls — `hyprctl dispatch dpms on` is rejected, use hl.dsp.dpms(...).
# No DPMS off on nouveau: it runtime-suspends the GPU and the GSP firmware fails to resume (black screen until
# reboot, 2026-09-13/14). Idle "screen off" = backlight 0 instead; after_sleep_cmd keeps the dpms-on nudge (harmless).
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}
listener { timeout = 300;  on-timeout = brightnessctl -s set 20%; on-resume = brightnessctl -r }
listener { timeout = 600;  on-timeout = loginctl lock-session }
listener { timeout = 900;  on-timeout = brightnessctl -q -s set 0; on-resume = brightnessctl -q -r }
