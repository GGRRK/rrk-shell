# Hyprland 0.56+: dispatchers are Lua calls — `hyprctl dispatch dpms on` is rejected, use hl.dsp.dpms("on").
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}
listener { timeout = 300;  on-timeout = brightnessctl -s set 20%; on-resume = brightnessctl -r }
listener { timeout = 600;  on-timeout = loginctl lock-session }
listener { timeout = 900;  on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'; on-resume = hyprctl dispatch 'hl.dsp.dpms("on")' }
