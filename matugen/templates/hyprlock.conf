# generated by matugen — do not edit (source: rrk-shell/matugen/templates/hyprlock.conf)
#
# Lock screen after ilyamiro's: heavily blurred, slightly darkened wallpaper, clock top-centre, round avatar
# with a primary ring + user name + password pill in the middle, layout/battery/weather pills bottom-centre,
# sleep button bottom-right. Colours come from the matugen palette (same tokens as the shell's Theme).
#
# Units: hyprlock draws on the PHYSICAL surface of eDP-1 (3840x2160; Hyprland scale 2 -> every px value
# here is 2x the logical size) and font_size is in points (1pt = 4/3 px, so logical px = font_size * 2/3).
# Origin is bottom-left, +y is up, and `position` is an offset from the halign/valign anchor
# (halign/valign = center -> the widget's centre sits at screen-centre + offset).
# Label `cmd[...]` commands all run on ONE worker thread inside hyprlock: a command that blocks freezes
# the clock and every other pill, so lock-status.sh always returns at once (network work is detached).

$font   = JetBrainsMono Nerd Font
$avatar = $HOME/.config/rrk-shell/avatar.png
$status = $HOME/claude/rrk-shell/shell/scripts/lock-status.sh

general {
    hide_cursor = false          # the sleep button is clickable
    ignore_empty_input = true    # Enter on an empty field is not a failed attempt (pam_faillock locks after 3)
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldColors, 1, 3, linear
}

# ── background: the current wallpaper, heavily blurred, slightly darkened (blurred once, then cached) ──
background {
    monitor =
    path = {{image}}
    color = rgb({{colors.surface.default.hex_stripped}})
    blur_passes = 4
    blur_size = 8
    brightness = 0.8
    contrast = 0.9
    vibrancy = 0.2
    noise = 0.01
}

# ── clock + date (logical: 128 px clock centred at y=270, 22 px date at y=372) ─────────────────────
# $TIME is updated by hyprlock itself (no process spawned) and only re-rendered when the text changes.
label {
    monitor = eDP-1
    text = <span weight="500">$TIME</span>
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 192
    font_family = $font
    position = 0, 540
    halign = center
    valign = center
}
label {
    monitor = eDP-1
    text = cmd[update:60000] date +'%A, %B %-d'
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    font_size = 33
    font_family = $font
    position = 0, 336
    halign = center
    valign = center
}

# ── avatar (168 px circle centred at logical 803,575) + name / prompt / password column (left edge x=923) ──
image {
    monitor = eDP-1
    path = $avatar
    size = 328
    rounding = -1
    border_size = 4
    border_color = rgb({{colors.primary.default.hex_stripped}})
    position = -314, -70
    halign = center
    valign = center
}
label {
    monitor = eDP-1
    text = <span weight="500">$USER</span>
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 40
    font_family = $font
    position = 1846, 46
    halign = left
    valign = center
}
shape {
    monitor = eDP-1
    size = 60, 60
    rounding = -1
    color = rgba({{colors.surface_container.default.hex_stripped}}99)
    border_size = 2
    border_color = rgba({{colors.primary.default.hex_stripped}}99)
    position = -42, -58
    halign = center
    valign = center
}
label {
    monitor = eDP-1
    text = <span font_desc="Material Symbols Rounded 27 @FILL=1">lock</span>
    color = rgb({{colors.primary.default.hex_stripped}})
    font_size = 27
    font_family = $font
    position = -42, -58
    halign = center
    valign = center
    zindex = 1
}
label {
    monitor = eDP-1
    text = <span weight="bold" letter_spacing="4096">ENTER PASSWORD</span>
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    font_size = 21
    font_family = $font
    position = 1938, -58
    halign = left
    valign = center
}
input-field {
    monitor = eDP-1
    size = 548, 104
    outline_thickness = 4
    rounding = -1
    dots_size = 0.22
    dots_spacing = 1.0
    dots_center = true
    outer_color = rgba({{colors.primary.default.hex_stripped}}e6)
    inner_color = rgba({{colors.surface_container.default.hex_stripped}}b3)
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    font_family = $font
    check_color = rgb({{colors.tertiary.default.hex_stripped}})
    fail_color = rgb({{colors.error.default.hex_stripped}})
    capslock_color = rgb({{colors.secondary.default.hex_stripped}})
    fade_on_empty = false
    placeholder_text = <span> </span>
    fail_text = <span foreground="##{{colors.error.default.hex_stripped}}" weight="bold">$FAIL</span>
    position = 202, -186
    halign = center
    valign = center
}

# ── status pills, bottom centre (44 px tall, 40 px above the bottom edge): layout · battery · weather ──
# (weather = a cache read every 15 s; lock-status.sh refreshes the cache in a detached job, no signals)
shape {
    monitor = eDP-1
    size = 164, 84
    rounding = -1
    color = rgba({{colors.surface_container.default.hex_stripped}}b3)
    border_size = 2
    border_color = rgba({{colors.outline_variant.default.hex_stripped}}8c)
    position = -252, -956
    halign = center
    valign = center
}
label {
    monitor = eDP-1
    text = cmd[update:5000:1] $status layout "$LAYOUT"
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 22
    font_family = $font
    position = -252, -956
    halign = center
    valign = center
    zindex = 1
}
shape {
    monitor = eDP-1
    size = 204, 84
    rounding = -1
    color = rgba({{colors.surface_container.default.hex_stripped}}b3)
    border_size = 2
    border_color = rgba({{colors.outline_variant.default.hex_stripped}}8c)
    position = -40, -956
    halign = center
    valign = center
}
label {
    monitor = eDP-1
    text = cmd[update:30000] $status battery
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 22
    font_family = $font
    position = -40, -956
    halign = center
    valign = center
    zindex = 1
}
shape {
    monitor = eDP-1
    size = 244, 84
    rounding = -1
    color = rgba({{colors.surface_container.default.hex_stripped}}b3)
    border_size = 2
    border_color = rgba({{colors.outline_variant.default.hex_stripped}}8c)
    position = 212, -956
    halign = center
    valign = center
}
label {
    monitor = eDP-1
    text = cmd[update:15000] $status weather
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 22
    font_family = $font
    position = 212, -956
    halign = center
    valign = center
    zindex = 1
}

# ── moon button, bottom right (48 px circle, 40 px from both edges); click = DPMS off via screen-off.sh, NOT suspend ──
# (DPMS off is safe since nouveau.runpm=0 (2026-09-14); the backlight cannot be changed under nouveau on this laptop.
#  the reference has a power glyph that shuts down; for that use `power_settings_new` + `systemctl poweroff`)
shape {
    monitor = eDP-1
    size = 92, 92
    rounding = -1
    color = rgba({{colors.surface_container.default.hex_stripped}}b3)
    border_size = 2
    border_color = rgba({{colors.outline_variant.default.hex_stripped}}8c)
    onclick = $HOME/claude/rrk-shell/shell/scripts/screen-off.sh
    position = 1792, -956
    halign = center
    valign = center
}
label {
    monitor = eDP-1
    text = <span font_desc="Material Symbols Rounded 30 @FILL=1">bedtime</span>
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 30
    font_family = $font
    position = 1792, -956
    halign = center
    valign = center
    zindex = 1
}
