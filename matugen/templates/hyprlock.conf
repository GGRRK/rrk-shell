# generated by matugen — do not edit (source: rrk-shell/matugen/templates/hyprlock.conf)
general {
    hide_cursor = true
}
background {
    monitor =
    path = {{image}}
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb({{colors.primary.default.hex_stripped}})
    inner_color = rgb({{colors.surface_container.default.hex_stripped}})
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    check_color = rgb({{colors.tertiary.default.hex_stripped}})
    fail_color = rgb({{colors.error.default.hex_stripped}})
    fade_on_empty = false
    placeholder_text = <span foreground="##{{colors.outline.default.hex_stripped}}">password</span>
    rounding = 16
    position = 0, -80
    halign = center
    valign = center
}
