# cava.conf — used by shell/services/Cava.qml (`cava -p <this file>`) for the desktop visualizer widget.
# Raw ASCII output on stdout: one line per frame, 40 values 0..100 separated by ';' (frame delimiter = newline).
# 20 fps on purpose: every frame is a layer-shell commit on the Bottom layer, which makes Hyprland re-render
# the whole screen (and its blur buffer) — keep this low on the nouveau driver.
[general]
framerate = 20
bars = 40
autosens = 1
sensitivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 5

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
monstercat = 1
waves = 0
noise_reduction = 70
